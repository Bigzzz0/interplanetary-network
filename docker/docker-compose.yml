version: "3.9"

services:
  sender:
    build:
      context: ..
      dockerfile: docker/Dockerfile.sender
    ports:
      - "8001:8001"
    volumes:
      - ../dataset:/app/dataset
    restart: unless-stopped

  network_simulator:
    build:
      context: ..
      dockerfile: docker/Dockerfile.network_simulator
    ports:
      - "8002:8002"
    environment:
      - SENDER_HOST=sender
    depends_on:
      - sender
    restart: unless-stopped

  edge_server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.edge_server
    ports:
      - "8003:8003"
    environment:
      - NETWORK_SIMULATOR_HOST=network_simulator
    depends_on:
      - network_simulator
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]  # Optional: GPU support for ML
              count: all

  client:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    ports:
      - "8004:8004"
    environment:
      - EDGE_SERVER_HOST=edge_server
    depends_on:
      - edge_server
    restart: unless-stopped
